<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Keystroke Kingdom favicon: an arcade keycap (Keystroke) crowned in gold (Kingdom),
       drawn in the game's own key-guide palette — cyan key box on arcade black. -->
  <title>Keystroke Kingdom</title>

  <!-- Arcade-cabinet backdrop: near-black navy, rounded like a CRT bezel -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0b0e1a"/>

  <!-- The keycap: glowing cyan rounded box, matching the in-game keyboard guide -->
  <rect x="7" y="14" width="18" height="14" rx="3" fill="#0f2438"/>
  <rect x="7" y="14" width="18" height="14" rx="3" fill="none" stroke="#39e0ff" stroke-width="2"/>
  <!-- keycap top highlight so it reads as a physical cap -->
  <rect x="10" y="17" width="12" height="2" fill="#8af3ff" opacity="0.55"/>

  <!-- The crown: gold, three peaks with jewel tips -->
  <polygon points="8,13 8,6 12,9 16,4 20,9 24,6 24,13" fill="#ffc63a"/>
  <rect x="8" y="11" width="16" height="2" fill="#ffb01f"/>
  <rect x="7" y="4" width="2" height="2" fill="#fff0a8"/>
  <rect x="15" y="2" width="2" height="2" fill="#fff0a8"/>
  <rect x="23" y="4" width="2" height="2" fill="#fff0a8"/>
</svg>
